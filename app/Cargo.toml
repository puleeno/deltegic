[workspace]
members = [
    "crates/nexdl-core",
    "crates/nexdl-addon-api",
    "crates/nexdl-accounts",
    "crates/nexdl-scheduler",
    "crates/nexdl-gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NexDL Team"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-channel = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "multipart", "stream"] }

# Python interop
pyo3 = { version = "0.22", features = ["auto-initialize"] }

# Crypto
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# Concurrency
dashmap = "6"
parking_lot = "0.12"

# Config / storage
toml = "0.8"
dirs = "5"

# URL parsing
url = "2"

# Regex
regex = "1"

# Internal crates
nexdl-core = { path = "crates/nexdl-core" }
nexdl-accounts = { path = "crates/nexdl-accounts" }
nexdl-scheduler = { path = "crates/nexdl-scheduler" }
nexdl-addon-api = { path = "crates/nexdl-addon-api" }
